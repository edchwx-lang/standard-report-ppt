interface:
  display_name: "Standard Report PPT"
  short_description: "V6.2.2 editable deconstruct or bitmap consulting decks"
  brand_color: "#2F5597"
  default_prompt: "Use $standard-report-ppt V6.2.2 for new projects while preserving V5.9 and V5.8 compatibility. Confirm the exact page count and explicitly ask for deconstruct or bitmap construction before content production. Both modes require builtin ImageGen and one immutable blueprint per page. Before ImageGen, reject agent-added bans on icons, photos, people, maps, logos, or other visual categories. Use windows_com_v584 on Windows or mac_python_pptx_v2 on macOS; never switch modes automatically. In deconstruct mode, preserve literal text geometry and use the bundled Windows render environment. Bitmap mode retains V6.2.1 behavior."
policy:
  allow_implicit_invocation: true
