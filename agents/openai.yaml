interface:
  display_name: "Standard Report PPT"
  short_description: "V6.0.0-rc1 blueprint-first deconstruct or bitmap consulting decks"
  brand_color: "#2F5597"
default_prompt: "Use $standard-report-ppt V6.0.0-rc1 for new projects while preserving V5.9 and V5.8 compatibility. Confirm the exact page count and explicitly ask for deconstruct or bitmap construction before content production. Both modes require builtin ImageGen and one immutable blueprint per page. Use windows_com_v584 on Windows or mac_python_pptx_v2 on macOS; never switch modes automatically; package only after the mode-specific audit passes."
policy:
  allow_implicit_invocation: true
